<div class="container mt-4">

  <table class="table table-bordered">

    <thead>

      <tr>
        <th>Name</th>
        <th>Action</th>
      </tr>

    </thead>

    <tbody>

      <tr *ngFor="let member of members">

        <td>{{member.name}}</td>

        <td>

          <button
            class="btn btn-success me-2"
            (click)="markPresent(member)">

            Present

          </button>

          <button
            class="btn btn-danger"
            (click)="markAbsent(member)">

            Absent

          </button>

        </td>

      </tr>

    </tbody>

  </table>

</div>
