<div class="container mt-4">

  <div class="row">
    <div class="col-md-3">
      <div class="card shadow text-center">
        <div class="card-body">
          <h5>Members</h5>
          <p class="display-6">{{members}}</p>
        </div>
      </div>
    </div>

    <div class="col-md-3">
      <div class="card shadow text-center">
        <div class="card-body">
          <h5>Trainers</h5>
          <p class="display-6">15</p>
        </div>
      </div>
    </div>

    <div class="col-md-3">
      <div class="card shadow text-center">
        <div class="card-body">
          <h5>Classes</h5>
          <p class="display-6">18</p>
        </div>
      </div>
    </div>

    <div class="col-md-3">
      <div class="card shadow text-center">
        <div class="card-body">
          <h5>Revenue</h5>
          <p class="display-6">₹85,000</p>
        </div>
      </div>
    </div>
  </div>

</div>
<div class="container mt-4">

  <div class="row">
    
    <div class="col-md-6">
      <div class="card shadow p-3">
        <h4>Membership Growth</h4>
        <canvas id="membershipChart"></canvas>
      </div>
    </div>

    <div class="col-md-6">
      <div class="card shadow p-3">
        <h4>Visitor Statistics</h4>
        <canvas id="visitorChart"></canvas>
      </div>
    </div>

  </div>

</div>
