<section class="hero-section">
   <br>
   
<div class="container mt-5">
  <button routerLink="/home" class="login-btn">Back To Home</button>
  <div class="row justify-content-center">
    <div class="col-md-4">

      <div class="card shadow">
        <div class="card-header text-center">
          <h4>Login</h4>
        </div>

        <div class="card-body">
          <div class="mb-3">
            <label class="form-label">Username</label>
            <input class="form-control"
                   [(ngModel)]="data.username">
          </div>

          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password"
                   class="form-control"
                   [(ngModel)]="data.password">
          </div>

          <button class="btn btn-primary w-100"
                  (click)="login()">
            Login
          </button>
        </div>

      </div>
    </div>
    <div>
        <p>If User Is Not Registered <span><a  class="register-link" routerLink="/register">Register Here</a></span></p>
    </div>
  </div>
</div>
</section>
