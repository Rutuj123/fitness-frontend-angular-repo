<div class="container mt-4">
    <h3>Gym Membership Payment</h3>
    <form (ngSubmit)="pay()">
        <div class="mb-3">
            <p><b>Selected Plan:</b> {{ plan }}</p>
            <label>Amount</label>
            <input type="number" [(ngModel)]="amount" name="amount" class="form-control" required>
        </div>
        <input
    type="text"
    placeholder="UTR Number"
    [(ngModel)]="utrNumber"
    name="utr">
        <div class="mb-3">
            <label>Payment Method</label>
            <select [(ngModel)]="paymentMethod" name="paymentMethod" class="form-control">
                <option value="UPI">UPI</option>
                <option value="CARD">CARD</option>
                <option value="CASH">CASH</option>
            </select>
        </div>
         <input
    type="file"
    (change)="onFileSelected($event)" placeholder="Attached screenshot of payment">
        <button class="btn btn-success">Pay Now</button>
    </form>
</div>>
