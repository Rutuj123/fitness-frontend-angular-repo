<div class="container mt-4">
  <h3>Our Trainers</h3>

  <div class="row mt-3">
    <div class="col-md-4" *ngFor="let t of trainers">
      <div class="card shadow">
        <div class="card-body">
          <h5>{{ t.name }}</h5>
          <p>Specialization: {{ t.specialization }}</p>
          <p>Experience: {{ t.experience }} years</p>

          <span class="badge"
                [class.bg-success]="t.available"
                [class.bg-danger]="!t.available">
            {{ t.available ? 'Available' : 'Not Available' }}
          </span>
        </div>
      </div>
    </div>
  </div>
</div>
